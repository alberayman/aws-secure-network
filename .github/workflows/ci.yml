name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate (no backend, no AWS credentials needed)
        run: |
          terraform -chdir=terraform/envs/dev init -backend=false -input=false
          terraform -chdir=terraform/envs/dev validate
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --chdir=terraform

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true # set to false once every finding is fixed or justified (docs/week3/ci-findings.md)
